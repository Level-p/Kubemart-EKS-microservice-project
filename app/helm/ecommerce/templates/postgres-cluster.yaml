{{- $pg := .Values.postgres -}}
{{- $super := include "kubemart.dbSecret" (dict "root" . "user" "postgres") -}}
# A highly available PostgreSQL cluster, self-managed in the cluster by the
# Zalando postgres-operator (installed by Terraform). From this short
# description the operator creates:
#   - StatefulSet "{{ $pg.clusterName }}": {{ $pg.instances }} pods, each with its own EBS disk,
#     each in a different Availability Zone
#   - Patroni in every pod: one primary, the others copy every change from it and
#     one of them is promoted automatically (about 30 s) if the primary fails
#   - Service "{{ $pg.clusterName }}"      -> always the primary (the apps write here)
#     Service "{{ $pg.clusterName }}-repl" -> the replicas (backups read here)
#   - one database per service, each owned by its own user, and a password
#     Secret per user: <user>.{{ $pg.clusterName }}.credentials.postgresql.acid.zalan.do
#   - a PodDisruptionBudget, so a node upgrade never stops the primary and a replica together
apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: {{ $pg.clusterName }}
  labels:
    {{- include "kubemart.labels" (dict "root" . "name" $pg.clusterName) | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    # Never let Argo CD delete the database, even if this file disappears from Git.
    # Removing a database is a deliberate, manual act.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    helm.sh/resource-policy: keep
spec:
  teamId: kubemart
  numberOfInstances: {{ $pg.instances }}
  postgresql:
    version: {{ $pg.version | quote }}
    parameters:
      max_connections: "200"
      # Long reads on a replica (backups) are not cancelled by changes on the primary
      hot_standby_feedback: "on"
      log_min_duration_statement: "1000"   # log queries slower than 1 s
  patroni:
    synchronous_mode: {{ $pg.synchronousMode }}
    # If every replica is down the primary keeps accepting writes (shop stays open)
    synchronous_mode_strict: false
  volume:
    size: {{ $pg.persistence.size }}
    storageClass: {{ $pg.persistence.storageClass }}
  users:
    {{- range $db, $user := $pg.databases }}
    {{ $user }}: []
    {{- end }}
  databases:
    {{- range $db, $user := $pg.databases }}
    {{ $db }}: {{ $user }}
    {{- end }}
  resources:
    {{- toYaml $pg.resources | nindent 4 }}
  {{- if .Values.exporters.postgres.enabled }}
  # Runs next to PostgreSQL in every pod and turns its statistics into Prometheus
  # metrics: pg_up, replication lag, connections, database sizes...
  sidecars:
    - name: postgres-exporter
      image: "{{ .Values.exporters.postgres.image.repository }}:{{ .Values.exporters.postgres.image.tag }}"
      ports:
        - name: metrics
          containerPort: 9187
          protocol: TCP
      env:
        - name: DATA_SOURCE_URI
          value: "127.0.0.1:5432/postgres?sslmode=require"
        - name: DATA_SOURCE_USER
          valueFrom:
            secretKeyRef: { name: {{ $super }}, key: username }
        - name: DATA_SOURCE_PASS
          valueFrom:
            secretKeyRef: { name: {{ $super }}, key: password }
        # One set of size metrics per database
        - name: PG_EXPORTER_AUTO_DISCOVER_DATABASES
          value: "true"
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 100m, memory: 64Mi }
  {{- end }}
{{- if .Values.exporters.postgres.enabled }}
---
# The operator's Services only expose port 5432; this one lets Prometheus reach
# the exporter on every database pod (primary and replicas)
apiVersion: v1
kind: Service
metadata:
  name: {{ $pg.clusterName }}-metrics
  labels:
    {{- include "kubemart.labels" (dict "root" . "name" $pg.clusterName) | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    application: spilo
    cluster-name: {{ $pg.clusterName }}
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187
{{- end }}
