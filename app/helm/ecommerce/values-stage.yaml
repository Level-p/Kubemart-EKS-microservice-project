# Stage environment (namespace kubemart-stage)
# GitHub Actions (kubemart-app.yml) updates global.imageRegistry and the tags of the services it rebuilt.
# Argo CD syncs this file automatically.
global:
  environment: stage
  imageRegistry: "127214197057.dkr.ecr.eu-west-2.amazonaws.com"
ingress:
  host: shop-stage.mfon21.space
  groupName: kubemart-stage
services:
  frontend:
    tag: 5-f6784fe
    replicas: 1
  product-catalog:
    tag: 5-f6784fe
    replicas: 1
  cart:
    tag: 5-f6784fe
    replicas: 1
  orders:
    tag: 5-f6784fe
    replicas: 1
  payment:
    tag: 5-f6784fe
    replicas: 1
# Same 3-member setup as prod, so failovers can be rehearsed here first.
# Asynchronous replication is enough for test data and a little faster.
postgres:
  instances: 3
  synchronousMode: false
  persistence:
    size: 5Gi
monitoring:
  prometheusRule:
    severity: warning
  grafanaDashboard:
    enabled: false
