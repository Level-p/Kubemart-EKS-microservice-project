# Tests use an in-memory H2 database in PostgreSQL mode, so they need no server.
# The same Flyway migrations run against it.
spring:
  datasource:
    url: jdbc:h2:mem:orders;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  flyway:
    connect-retries: 0

logging:
  structured:
    format:
      console: ""
