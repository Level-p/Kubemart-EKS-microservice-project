server:
  port: ${PORT:8080}
  shutdown: graceful          # finish in-flight requests on SIGTERM

spring:
  application:
    name: orders
  lifecycle:
    timeout-per-shutdown-phase: 20s
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s

  # PostgreSQL: database "orders" on the kubemart-db cluster. Kubernetes sets
  # DB_HOST and takes DB_USER / DB_PASSWORD from the Secret the postgres-operator
  # creates. The database only accepts TLS connections (sslmode=require).
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders}?sslmode=${DB_SSLMODE:require}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000      # ms to wait for a connection before failing the request
      max-lifetime: 600000          # recycle connections, e.g. after a failover

  flyway:
    # The database may start after this service, or be failing over: keep retrying
    connect-retries: 20
    connect-retries-interval: 10s

# Downstream services (overridden by environment variables in Kubernetes)
services:
  cart-url: ${CART_URL:http://localhost:8082}
  catalog-url: ${CATALOG_URL:http://localhost:8081}
  payment-url: ${PAYMENT_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true       # /actuator/health/liveness and /readiness
  metrics:
    tags:
      application: orders
    distribution:
      # Histogram buckets so Grafana can show the 95th percentile response time
      percentiles-histogram:
        http.server.requests: true

# JSON logs in Elastic Common Schema: Elasticsearch/Kibana understand them directly
logging:
  structured:
    format:
      console: ecs
