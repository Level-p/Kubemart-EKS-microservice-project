# Kibana connected to the Elasticsearch cluster above.
# TLS is terminated by the ALB, so Kibana itself serves plain HTTP inside the cluster.
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: {{ .Values.name }}
spec:
  version: {{ .Values.version }}
  count: 1
  elasticsearchRef:
    name: {{ .Values.name }}
  config:
    server.publicBaseUrl: "https://{{ .Values.kibana.host }}"
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  podTemplate:
    spec:
      containers:
        - name: kibana
          resources:
            requests:
              cpu: {{ .Values.kibana.cpu }}
              memory: {{ .Values.kibana.memory }}
            limits:
              memory: {{ .Values.kibana.memory }}
